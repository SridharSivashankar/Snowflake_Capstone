version: 2

models:
  - name: fact_sales
    description: Fact table at the order line item grain (OrderID + ProductID)

    columns:

      - name: sales_key
        description: Surrogate key for each sales transaction
        tests:
          - unique
          - not_null

      - name: order_id
        description: Degenerate dimension representing the business order number
        tests:
          - not_null

      - name: customer_key
        description: Foreign key to dim_customer
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key

      - name: product_key
        description: Foreign key to dim_product
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key

      - name: store_key
        description: Foreign key to dim_store
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key

      - name: date_key
        description: Foreign key to dim_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: employee_key
        description: Foreign key to dim_employee
        tests:
          - not_null
          - relationships:
              to: ref('dim_employee')
              field: employee_key

      - name: quantity_sold
        description: Quantity purchased on the order line
        tests:
          - not_null

      - name: unit_price
        description: Selling price per unit
        tests:
          - not_null

      - name: total_sales_amount
        description: Revenue generated for the order line
        tests:
          - not_null

      - name: cost_amount
        description: Cost associated with the order line
        tests:
          - not_null

      - name: discount_amount
        description: Discount applied to the order line
        tests:
          - not_null

      - name: shipping_cost
        description: Shipping cost associated with the order line
        tests:
          - not_null

      - name: profit_amount
        description: Profit generated by the order line
        tests:
          - not_null

      - name: region
        description: Sales region
        tests:
          - not_null

      - name: sales_channel
        description: Online or In-Store sales channel
        tests:
          - not_null
          - accepted_values:
              values:
                - Online
                - In-Store

      - name: customer_segment_impact
        description: Customer segment from dim_customer
        tests:
          - not_null
          - accepted_values:
              values:
                - Young
                - Middle-aged
                - Senior
                - Invalid