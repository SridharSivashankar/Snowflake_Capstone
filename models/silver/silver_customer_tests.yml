version: 2

models:
  - name: silver_customer
    description: Cleaned and standardized customer data

    columns:

      # Primary Key
      - name: customer_id
        tests:
          - unique
          - not_null

      # Customer Names
      - name: first_name
        tests:
          - not_null

      - name: last_name
        tests:
          - not_null

      - name: full_name
        tests:
          - not_null

      # Email Validation
      - name: email_id
        tests:
          - not_null

      - name: email_status
        tests:
          - not_null
          - accepted_values:
              values:
                - VALID
                - INVALID

      # Phone Validation
      - name: phone_status
        tests:
          - not_null
          - accepted_values:
              values:
                - VALID
                - INVALID


      # Dates
      - name: birth_date

      - name: registration_date
        tests:
          - not_null

      - name: last_purchase_date

      - name: last_modified_date
        tests:
          - not_null

      # Customer Age
      - name: customer_age

      # Segment
      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values:
                - Young
                - Middle-aged
                - Senior
                - Invalid

      # Loyalty Tier
      - name: loyalty_tier
        tests:
          - not_null
          - accepted_values:
              values:
                - BRONZE
                - SILVER
                - GOLD
                - PLATINUM

      # Income Bracket
      - name: income_bracket
        tests:
          - not_null
          - accepted_values:
              values:
                - LOW
                - MEDIUM
                - HIGH

      # Communication Preference
      - name: preferred_communication
        tests:
          - not_null
          - accepted_values:
              values:
                - EMAIL
                - PHONE
                - SMS
                - MAIL

      # Payment Method
      - name: preferred_payment_method
        tests:
          - not_null

      # Marketing Flag
      - name: marketing_opt_in
        tests:
          - not_null

      # Metrics
      - name: total_purchases
        tests:
          - not_null

      - name: total_spend
        tests:
          - not_null

      # Occupation
      - name: occupation
        tests:
          - not_null

      # Address
      - name: street
        tests:
          - not_null

      - name: city
        tests:
          - not_null

      - name: state
        tests:
          - not_null

      - name: country
        tests:
          - not_null

      - name: zip_code
        tests:
          - not_null

      - name: standardized_address
        tests:
          - not_null