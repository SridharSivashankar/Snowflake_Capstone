version: 2

models:
  - name: silver_store

    columns:

      - name: store_id
        tests:
          - unique
          - not_null

      - name: store_name
        tests:
          - not_null

      - name: store_type
        tests:
          - not_null
          - accepted_values:
              values:
                - Flagship
                - Department
                - Outlet
                - Express

      - name: region
        tests:
          - not_null
          - accepted_values:
              values:
                - Northeast
                - Midwest
                - South
                - West

      - name: manager_id
        tests:
          - not_null

      - name: email_id
        tests:
          - not_null

      - name: valid_email_id
        tests:
          - not_null

      - name: email_status
        tests:
          - not_null
          - accepted_values:
              values:
                - VALID
                - INVALID

      - name: original_phone
        tests:
          - not_null

      - name: phn_no
        tests:
          - not_null

      - name: phone_status
        tests:
          - not_null
          - accepted_values:
              values:
                - VALID
                - INVALID

      - name: street
        tests:
          - not_null

      - name: city
        tests:
          - not_null

      - name: state
        tests:
          - not_null

      - name: country
        tests:
          - not_null
          - accepted_values:
              values:
                - USA

      - name: zip_code
        tests:
          - not_null

      - name: postal_code_status
        tests:
          - not_null
          - accepted_values:
              values:
                - VALID
                - INVALID

      - name: standardized_address
        tests:
          - not_null

      - name: opening_date
        tests:
          - not_null

      - name: last_modified_date
        tests:
          - not_null

      - name: store_age_years
        tests:
          - not_null

      - name: size_sq_ft
        tests:
          - not_null

      - name: store_size_category
        tests:
          - not_null
          - accepted_values:
              values:
                - Small
                - Medium
                - Large

      - name: employee_count
        tests:
          - not_null

      - name: current_sales
        tests:
          - not_null

      - name: sales_target
        tests:
          - not_null

      - name: monthly_rent
        tests:
          - not_null

      - name: is_active
        tests:
          - not_null

      - name: sales_target_achievement_percentage
        tests:
          - not_null

      - name: revenue_per_sq_ft
        tests:
          - not_null

      - name: employee_efficiency
        tests:
          - not_null

      - name: performance_flag
        tests:
          - not_null
          - accepted_values:
              values:
                - HEALTHY
                - PERFORMANCE ISSUE

      - name: weekday_hours
        tests:
          - not_null

      - name: weekend_hours
        tests:
          - not_null

      - name: holiday_hours
        tests:
          - not_null

      - name: services
        tests:
          - not_null